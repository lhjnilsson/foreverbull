version: "3"

includes:
  client:
    taskfile: ./client/taskfile.yaml
    dir: client/
  grafana:
    taskfile: ./grafana/taskfile.yaml
    dir: grafana/

tasks:
  proto:clean:
    desc: Remove generated protobuf files
    cmds:
      - find client/src/foreverbull/pb -type f \( -name '*_pb2.py' -o -name '*_pb2.pyi' -o -name '*_pb2_grpc.py' \) -delete
      - find pkg/pb -type f -name '*.pb.go' -delete
      - find internal/stream/pb -type f -name '*.pb.go' -delete

  proto:generate:
    desc: Generate Go protobuf code
    cmds:
      # Vendored protovalidate is a Python stub only; its go_package points at the BSR module.
      - buf generate proto --exclude-path proto/buf

  proto:
    desc: Generate Go and Python protobuf code
    cmds:
      - task: proto:clean
      - task: proto:generate
      - task: client:proto:generate

  proto:check:
    desc: Fail if generated protobuf is out of date
    cmds:
      - task: proto
      - |
        dirty="$(git status --porcelain -- pkg/pb client/src/foreverbull/pb internal/stream/pb)"
        if [ -n "${dirty}" ]; then
          echo "Generated protobuf is dirty. Run 'task proto' and commit the result." >&2
          git status -- pkg/pb client/src/foreverbull/pb internal/stream/pb
          git --no-pager diff -- pkg/pb client/src/foreverbull/pb internal/stream/pb
          exit 1
        fi

  backtest:test:integration:
    desc: Run backtest integration tests
    dir: ./pkg/backtest
    deps:
      - client:docker:zipline
    cmds:
      - go test . -tags=integration {{.CLI_ARGS}} 
      - go test ./stream/ -tags=integration {{.CLI_ARGS}}

  backtest:test:unit:
    desc: Run backtest unit tests
    dir: ./pkg/backtest
    cmds:
      - go test ./... {{.CLI_ARGS}}

  finance:test:unit:
    desc: Run finance unit tests
    dir: ./pkg/finance
    cmds:
      - go test ./... {{.CLI_ARGS}}

  service:test:unit:
    desc: Run service unit tests
    dir: ./pkg/service
    cmds:
      - go test ./... {{.CLI_ARGS}}

  strategy:test:unit:
    desc: Run strategy unit tests
    dir: ./pkg/strategy
    cmds:
      - go test ./... {{.CLI_ARGS}}

  test:unit:
    desc: Run all Go unit tests
    deps:
      - backtest:test:unit
      - finance:test:unit
      - service:test:unit
      - strategy:test:unit

  test:integration:
    desc: Run client end-to-end tests
    dir: client/
    deps:
      - build:docker
      - client:docker:zipline
      - grafana:build:docker
    cmds:
      - uv sync
      - VERSION=local ECHO=true uv run pytest tests/end_to_end/test_demo.py -vs

  mock:clean:
    desc: Remove generated mocks
    cmds:
      - find pkg/ -type f -name "mock_*.go" -delete
      - find internal/ -type f -name "mock_*.go" -delete

  mock:generate:
    desc: Generate Go mocks
    cmds:
      - mockery --dir pkg --all --inpackage
      - mockery --dir internal --all --inpackage

  build:docker:
    desc: Build the local Foreverbull image
    sources:
      - pkg/**/*.go
      - internal/**/*.go
      - internal/web/page/**/*
      - cmd/**/*.go
      - docker/Dockerfile
      - .dockerignore
      - web/package.json
      - web/package-lock.json
      - web/index.html
      - web/vite.config.ts
      - web/tsconfig.json
      - web/src/**/*
    cmds:
      - docker build -t lhjnilsson/foreverbull:local -f docker/Dockerfile .

  build:
    desc: Build local images and sync the Python workspace
    deps:
      - client:docker:zipline
      - grafana:build:docker
      - build:docker
      - client:venv

  env:
    desc: Removed. Run task build, then uv run fbenv create
    cmds:
      - |
        echo "task env no longer installs the platform." >&2
        echo "Build local images and sync the client:" >&2
        echo "  task build" >&2
        echo "Install into Kind, then start the workloads:" >&2
        echo "  cd client && VERSION=local uv run fbenv create && uv run fbenv start" >&2
        exit 1

  kind:create:
    desc: Create the local Kind cluster (idempotent)
    cmds:
      - bash deploy/kind/create-cluster.sh

  kind:load:
    desc: Load lhjnilsson/foreverbull, zipline, and fb-grafana into Kind
    cmds:
      - bash deploy/kind/load-images.sh

  helm:install:
    desc: helm upgrade --install Foreverbull into the local Kind cluster
    cmds:
      - bash deploy/kind/helm-install.sh {{.CLI_ARGS}}

  web:dev:
    desc: Run the web shell with Vite hot reload
    dir: web
    cmds:
      - npm run dev
