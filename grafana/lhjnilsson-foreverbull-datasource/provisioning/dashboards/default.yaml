apiVersion: 1

# File provider: every *.json in this directory.
#   executions.json         uid ee9ep4jxtwkcgf       (CLI / GetExperiment deep links)
#   strategy-compare.json   uid fb-strategy-compare
#   backtest-overview.json  uid fb-backtest-overview
#
# apply-web-links runs before Grafana and replaces __FOREVERBULL_WEB_URL__
# from FOREVERBULL_WEB_URL. An empty value hides the links; an unusable one
# stops Grafana from starting. Grafana does not expand environment variables
# inside these JSON files. A dollar sign in the origin is unusable, because
# Grafana would interpolate it.
providers:
  - name: Foreverbull
    orgId: 1
    folder: Foreverbull
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
