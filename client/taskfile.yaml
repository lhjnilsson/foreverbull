version: "3"

tasks:
  venv:
    desc: Sync the Python workspace with uv
    cmds:
      - uv sync

  lint:
    desc: Lint Python with ruff
    cmds:
      - uvx ruff check

  format:
    desc: Format Python with ruff
    cmds:
      - uvx ruff format

  test:
    desc: Run Python unit tests
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  build:foreverbull:
    desc: Build the foreverbull Python package
    sources:
      - src/foreverbull/**/*.py
    generates:
      - dist/foreverbull-0.0.0-py3-none-any.whl
    cmds:
      - uv build

  docker:zipline:
    desc: Build the local Zipline image
    deps:
    - build:foreverbull
    sources:
      - zipline/src/foreverbull_zipline/**/*.py
    cmds:
      - docker build -t lhjnilsson/zipline:local -f zipline/Dockerfile .

  proto:generate:
    desc: Generate Python protobuf code
    dir: '{{.TASKFILE_DIR}}/..'
    cmds:
      # Internal stream messages are Go-only.
      - buf generate proto --template buf.gen.py.yaml --exclude-path proto/foreverbull/internal
      # Buf emits proto-rooted imports; rewrite them under foreverbull.pb.
      - LC_ALL=C find client/src/foreverbull/pb -name '*_pb2*' -exec sed -i '' 's/from foreverbull\./from foreverbull.pb.foreverbull./g' {} \;
      - LC_ALL=C find client/src/foreverbull/pb -name '*_pb2*' -exec sed -i '' 's/from foreverbull import common_pb2/from foreverbull.pb.foreverbull import common_pb2/g' {} \;
      - LC_ALL=C find client/src/foreverbull/pb -name '*_pb2*' -exec sed -i '' 's/from buf\.validate import/from foreverbull.pb.buf.validate import/g' {} \;

  template:generate:
    desc: Render cookiecutter templates
    sources:
      - templates/**/*
    cmds:
      - uv run cookiecutter --output-dir rendered/advanced templates/advanced/ --replay-file templates/advanced.json -f
      - uv run cookiecutter --output-dir rendered/simple templates/simple/ --replay-file templates/simple.json -f

  template:test:simple:
    desc: Test the simple cookiecutter template
    deps:
    - template:generate
    env:
      PYTHONPATH: rendered/simple/simple
    cmds:
      - uv run pytest rendered/simple/simple

  template:test:advanced:
    desc: Test the advanced cookiecutter template
    deps:
    - template:generate
    env:
      PYTHONPATH: rendered/advanced/advanced
    cmds:
      - |
        if uv run python -c "import talib" >/dev/null 2>&1; then
          uv run pytest rendered/advanced/advanced
        else
          echo "Skipping advanced template pytest: TA-Lib is not installed"
        fi

  template:test:
    desc: Test cookiecutter templates
    deps:
    - template:test:simple
    - template:test:advanced