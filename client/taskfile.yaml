version: "3"

tasks:
  venv:
    desc: Sync the Python workspace with uv
    cmds:
      - uv sync

  lint:
    desc: Lint Python with ruff
    cmds:
      - uvx ruff check

  format:
    desc: Format Python with ruff
    cmds:
      - uvx ruff format

  test:
    desc: Run Python unit tests
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  build:foreverbull:
    desc: Build the foreverbull Python package
    sources:
      - src/foreverbull/**/*.py
    generates:
      - dist/foreverbull-0.0.0-py3-none-any.whl
    cmds:
      - uv build

  docker:zipline:
    desc: Build the local Zipline image
    deps:
    - build:foreverbull
    sources:
      - zipline/src/foreverbull_zipline/**/*.py
    cmds:
      - docker build -t lhjnilsson/zipline:local -f zipline/Dockerfile .

  proto:generate:
    desc: Generate Python protobuf code
    cmds:
      - uv run python3 -m grpc_tools.protoc -I../proto --python_out=src/foreverbull/pb --pyi_out=src/foreverbull/pb --grpc_python_out=src/foreverbull/pb ../proto/foreverbull/finance/v1/*.proto      
      - uv run python3 -m grpc_tools.protoc -I../proto --python_out=src/foreverbull/pb --pyi_out=src/foreverbull/pb --grpc_python_out=src/foreverbull/pb ../proto/foreverbull/finance/service/v1/*.proto 
      - uv run python3 -m grpc_tools.protoc -I../proto --python_out=src/foreverbull/pb --pyi_out=src/foreverbull/pb --grpc_python_out=src/foreverbull/pb ../proto/foreverbull/backtest/v1/*.proto
      - uv run python3 -m grpc_tools.protoc -I../proto --python_out=src/foreverbull/pb --pyi_out=src/foreverbull/pb --grpc_python_out=src/foreverbull/pb ../proto/foreverbull/backtest/service/v1/*.proto
      - uv run python3 -m grpc_tools.protoc -I../proto --python_out=src/foreverbull/pb --pyi_out=src/foreverbull/pb --grpc_python_out=src/foreverbull/pb ../proto/foreverbull/service/v1/*.proto
      - uv run python3 -m grpc_tools.protoc -I../proto --python_out=src/foreverbull/pb --pyi_out=src/foreverbull/pb --grpc_python_out=src/foreverbull/pb ../proto/foreverbull/service/service/v1/*.proto
      #- uv run python3 -m grpc_tools.protoc -I../proto --python_out=src/foreverbull/pb --pyi_out=src/foreverbull/pb --grpc_python_out=src/foreverbull/pb ../proto/foreverbull/strategy/v1/*.proto
      - uv run python3 -m grpc_tools.protoc -I../proto --python_out=src/foreverbull/pb --pyi_out=src/foreverbull/pb --grpc_python_out=src/foreverbull/pb ../proto/foreverbull/strategy/service/v1/*.proto
      - uv run python3 -m grpc_tools.protoc -I../proto --python_out=src/foreverbull/pb --pyi_out=src/foreverbull/pb --grpc_python_out=src/foreverbull/pb ../proto/foreverbull/common.proto
      - uv run python3 -m grpc_tools.protoc -I../proto --python_out=src/foreverbull/pb --pyi_out=src/foreverbull/pb --grpc_python_out=src/foreverbull/pb ../proto/buf/validate/validate.proto
      # Update imports, could maybe be solved by organizing the proto files in a better way
      - LC_ALL=C find src/foreverbull/pb -name "*_pb2*" -exec sed -i '' 's/from foreverbull\./from foreverbull\.pb\.foreverbull./g' {} \;
      - LC_ALL=C find src/foreverbull/pb -name "*_pb2*" -exec sed -i '' 's/from foreverbull import common_pb2/from foreverbull\.pb\.foreverbull import common_pb2/g' {} \;
      - LC_ALL=C find src/foreverbull/pb -name "*_pb2*" -exec sed -i '' 's/from buf\.validate import/from foreverbull\.pb\.buf\.validate import/g' {} \;

  template:generate:
    desc: Render cookiecutter templates
    sources:
      - templates/**/*
    cmds:
      - uv run cookiecutter --output-dir rendered/advanced templates/advanced/ --replay-file rendered/advanced.json -f
      - uv run cookiecutter --output-dir rendered/simple templates/simple/ --replay-file rendered/simple.json -f

  template:test:simple:
    desc: Test the simple cookiecutter template
    deps:
    - template:generate
    env:
      PYTHONPATH: rendered/simple/simple
    cmds:
      - uv run pytest rendered/simple/simple

  template:test:advanced:
    desc: Test the advanced cookiecutter template
    deps: 
    - template:generate
    env:
      PYTHONPATH: rendered/advanced/advanced
    cmds:
      - uv run pytest rendered/advanced/advanced

  template:test:
    desc: Test cookiecutter templates
    deps:
    - template:test:simple
    - template:test:advanced