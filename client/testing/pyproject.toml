[project]
name = "foreverbull-testing"
version = "0.0.0"
description = "Pytest plugin and fixtures for Foreverbull algorithm tests"
readme = "README.md"
authors = [
    { name = "Henrik Nilsson", email = "henrik@lhjnilsson.com" }
]
requires-python = ">=3.12"
dependencies = [
    "foreverbull",
    "pytest",
    "sqlalchemy",
    "psycopg2-binary",
    "testcontainers",
    "yfinance",
]

[project.entry-points.pytest11]
foreverbull = "foreverbull_testing.plugin"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
foreverbull = { workspace = true }
