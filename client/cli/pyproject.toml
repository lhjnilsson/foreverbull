[project]
name = "foreverbull-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Henrik Nilsson", email = "henrik@lhjnilsson.com" }
]
requires-python = ">=3.13"
dependencies = [
    "typer[all]", "docker", "pyyaml"
]

[project.scripts]
fbull = "foreverbull_cli.bull.cli:cli"
fbenv = "foreverbull_cli.env.cli:cli"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
