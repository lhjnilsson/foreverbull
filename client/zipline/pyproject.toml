[project]
name = "foreverbull-zipline"
version = "0.0.0"
description = "Zipline backtest engine gRPC service and Docker image for Foreverbull"
readme = "README.md"
authors = [
    { name = "Henrik Nilsson", email = "henrik@lhjnilsson.com" }
]
requires-python = ">=3.12"
dependencies = [
    "foreverbull",
    "grpcio-health-checking",
    "zipline-reloaded",
    "empyrical-reloaded>=0.5.12",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
foreverbull = { workspace = true }