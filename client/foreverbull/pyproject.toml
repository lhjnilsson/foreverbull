[project]
name = "foreverbull"
version = "0.0.1"
description = "foreverbull"
authors = [{ name = "Henrik Nilsson", email = "henrik@lhjnilsson.com" }]
dependencies = [
  "pynng",
  "minio",
  "pandas",
  "sqlalchemy",
  "psycopg2-binary",
  "click",
  "cython",
  "docker",
  "pandas-datareader",
  "tables",
  "numpy",
  "setuptools",
  "protobuf",
  "types-protobuf",
  "grpcio",
]

[tool.hatch.build.targets.wheel]
packages = ["src/foreverbull"]

[tool.hatch.build.targets.sdist]
packages = ["src/foreverbull"]
