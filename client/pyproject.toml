[project]
name = "foreverbull"
version = "0.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Henrik Nilsson", email = "henrik@lhjnilsson.com" }
]
requires-python = ">=3.12"
dependencies = [
  "pynng",
  "minio",
  "pandas",
  "sqlalchemy",
  "psycopg2-binary",
  "click",
  "cython",
  "docker",
  "pandas-datareader",
  "tables",
  "numpy",
  "setuptools",
  "protobuf==5.29.0",
  "types-protobuf",
  "grpcio",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "cli",
    "testing",
    "zipline",
]

[tool.uv.sources]
foreverbull-zipline = { workspace = true }

[dependency-groups]
dev = [
    "cookiecutter>=2.6.0",
    "grpcio-testing>=1.71.2",
    "grpcio-tools>=1.71.2",
    "pytest>=8.4.1",
    "testcontainers>=4.12.0",
    "yfinance>=0.2.65",
]

[tool.pytest.ini_options]
addopts = [
"--ignore=tests/end_to_end",
"--ignore=tests/integration",
"--ignore=templates",
"--ignore=rendered",
]


[tool.ruff]
fix = true
target-version = "py313"
line-length = 120

[tool.ruff.lint]
exclude = ["src/foreverbull/pb/*", "templates/*"]

[tool.ruff.format]
exclude = ["src/foreverbull/pb/*", "templates/*"]

[tool.ruff.lint.isort]
force-single-line = true
lines-between-types = 1
lines-after-imports = 2
known-first-party = ["foreverbull"]
