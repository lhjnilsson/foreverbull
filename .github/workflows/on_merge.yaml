name: release
on:
  push:
    branches:
      - main

# Least privilege by default; create_release asks for what it writes.
permissions:
  contents: read

jobs:
  version_tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Get the version
        id: version
        run: echo "version=0.0.$(date +"%y%m%d%H%M")" >> "$GITHUB_OUTPUT"

  build_python_packages:
    needs: version_tag
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Set package versions
        run: |
          uv version --frozen --package foreverbull ${{ needs.version_tag.outputs.version }}
          uv version --frozen --package foreverbull-cli ${{ needs.version_tag.outputs.version }}
          uv version --frozen --package foreverbull-testing ${{ needs.version_tag.outputs.version }}
          uv version --frozen --package foreverbull-zipline ${{ needs.version_tag.outputs.version }}
      - name: Build packages
        run: uv build --all-packages
      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: client/dist

  build_push_zipline:
    needs: [build_python_packages, version_tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download Python packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: /tmp/pypi
      - name: Stage foreverbull wheel
        run: |
          set -euo pipefail
          wheel="$(find /tmp/pypi -name 'foreverbull-${{ needs.version_tag.outputs.version }}-py3-none-any.whl' -print -quit)"
          test -s "${wheel}"
          cp "${wheel}" "client/foreverbull-${{ needs.version_tag.outputs.version }}-py3-none-any.whl"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Zipline
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: client
          platforms: linux/amd64,linux/arm64
          file: ./client/zipline/Dockerfile
          tags: |
            lhjnilsson/zipline:${{ needs.version_tag.outputs.version }}
            lhjnilsson/zipline:latest
          build-args: |
            FB_WHEEL=foreverbull-${{ needs.version_tag.outputs.version }}-py3-none-any.whl
          push: true

  build_push_foreverbull:
    needs: version_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push foreverbull
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            lhjnilsson/foreverbull:${{ needs.version_tag.outputs.version }}
            lhjnilsson/foreverbull:latest
          push: true

  build_push_grafana:
    needs: version_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Grafana
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: grafana
          file: ./grafana/Dockerfile
          # COPY --from=foreverbull is the repo root (go.mod and pkg/), not an image.
          build-contexts: |
            foreverbull=${{ github.workspace }}
          platforms: linux/amd64,linux/arm64
          tags: |
            lhjnilsson/fb-grafana:${{ needs.version_tag.outputs.version }}
            lhjnilsson/fb-grafana:latest
          push: true

  publish_python_client:
    needs: [version_tag, build_push_zipline, build_push_foreverbull, build_push_grafana]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download Python packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: /tmp/pypi
      - name: Flatten packages
        run: |
          set -euo pipefail
          mkdir -p dist
          find /tmp/pypi -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -la dist
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Publish Python packages
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          uv publish dist/foreverbull-0*
          uv publish dist/foreverbull_testing-*
          uv publish dist/foreverbull_cli-*
          uv publish dist/foreverbull_zipline-*

  create_release:
    needs: [version_tag, publish_python_client]
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      packages: write
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ needs.version_tag.outputs.version }}
          tag_name: ${{ needs.version_tag.outputs.version }}
          body: |
            Release ${{ needs.version_tag.outputs.version }}
          prerelease: true
