name: release
on:
  push:
    branches:
      - main

# Least privilege by default; create_release asks for what it writes.
permissions:
  contents: read

jobs:
  version_tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get the version
        id: version
        run: echo "version=0.0.$(date +"%y%m%d%H%M")" >> "$GITHUB_OUTPUT"

  build_python_packages:
    needs: version_tag
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set package versions
        run: |
          uv version --frozen --package foreverbull ${{ needs.version_tag.outputs.version }}
          uv version --frozen --package foreverbull-cli ${{ needs.version_tag.outputs.version }}
          uv version --frozen --package foreverbull-testing ${{ needs.version_tag.outputs.version }}
          uv version --frozen --package foreverbull-zipline ${{ needs.version_tag.outputs.version }}
      - name: Build packages
        run: uv build --all-packages
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: client/dist

  build_push_zipline:
    needs: [build_python_packages, version_tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Python packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: /tmp/pypi
      - name: Stage foreverbull wheel
        run: |
          set -euo pipefail
          wheel="$(find /tmp/pypi -name 'foreverbull-${{ needs.version_tag.outputs.version }}-py3-none-any.whl' -print -quit)"
          test -s "${wheel}"
          cp "${wheel}" "client/foreverbull-${{ needs.version_tag.outputs.version }}-py3-none-any.whl"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Zipline
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: client
          platforms: linux/amd64,linux/arm64
          file: ./client/zipline/Dockerfile
          tags: |
            lhjnilsson/zipline:${{ needs.version_tag.outputs.version }}
            lhjnilsson/zipline:latest
          build-args: |
            FB_WHEEL=foreverbull-${{ needs.version_tag.outputs.version }}-py3-none-any.whl
          push: true

  build_push_foreverbull:
    needs: version_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push foreverbull
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            lhjnilsson/foreverbull:${{ needs.version_tag.outputs.version }}
            lhjnilsson/foreverbull:latest
          push: true

  build_push_grafana:
    needs: version_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Grafana
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: grafana
          file: ./grafana/Dockerfile
          # COPY --from=foreverbull is the repo root (go.mod and pkg/), not an image.
          build-contexts: |
            foreverbull=${{ github.workspace }}
          platforms: linux/amd64,linux/arm64
          tags: |
            lhjnilsson/fb-grafana:${{ needs.version_tag.outputs.version }}
            lhjnilsson/fb-grafana:latest
          push: true

  publish_python_client:
    needs: [version_tag, build_push_zipline, build_push_foreverbull, build_push_grafana]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Python packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: /tmp/pypi
      - name: Flatten packages
        run: |
          set -euo pipefail
          mkdir -p dist
          find /tmp/pypi -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -la dist
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Publish Python packages
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          uv publish dist/foreverbull-0*
          uv publish dist/foreverbull_testing-*
          uv publish dist/foreverbull_cli-*
          uv publish dist/foreverbull_zipline-*

  create_release:
    needs: [version_tag, publish_python_client]
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      packages: write
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ needs.version_tag.outputs.version }}
          tag_name: ${{ needs.version_tag.outputs.version }}
          body: |
            Release ${{ needs.version_tag.outputs.version }}
          prerelease: true
