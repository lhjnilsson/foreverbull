name: "on commit jobs"
# product-e2e loads the three images built below into Kind and runs
# tests/end_to_end through fbenv and fbull. It does not run on main.
# kind_e2e.yaml (workflow_dispatch + push to main) stays the post-merge
# health probe. Go backtest tests tagged //go:build integration stay off
# this workflow: they start their own Postgres, NATS, and Minio.
on:
  push:
    branches-ignore:
      - main
  # Fork branches never push here, so a pull request is the only event that
  # checks them. Same-repo branches are already checked by the push event, and
  # each job skips that pull request run instead of building the commit twice.
  pull_request:
    branches:
      - main

# A newer commit on the same branch or pull request supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the checkout and use artifacts.
permissions:
  contents: read

jobs:
  lint-unit-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -race ./pkg/... ./internal/... -coverprofile=coverage.txt -covermode=atomic -timeout 180s
        env:
          DISABLE_LOKI_LOGGING: true
      - name: Archive code coverage results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-coverage
          path: coverage.txt

  python-lint-unit-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Sync dependencies
        run: uv sync --all-packages --all-extras
      - name: Lint
        run: |
          uvx ruff@0.17.0 check
          uvx ruff@0.17.0 format --check
          uvx pyright
      - name: Unittest
        run: |
          uv run pytest tests/
          uv run pytest zipline/
          uv run pytest cli/
          uv run pytest testing/

  # Renders both cookiecutter templates and runs each generated project's pytest
  # against the workspace foreverbull and foreverbull_testing packages. The
  # backtest fixture skips unless --backtest is passed, so this does not dial a
  # broker. Kept off python-lint-unit-tests and off product-e2e's needs, and not
  # a required check.
  template-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./client
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Same versions as python-lint-unit-tests.
        python-version: ["3.12", "3.13", "3.14"]
    env:
      # ta-lib's setup.py reads these when the 0.6.4 sdist links libta-lib.
      TA_INCLUDE_PATH: /usr/local/include
      TA_LIBRARY_PATH: /usr/local/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install TA-Lib C library (advanced template)
        # The advanced template's macd.py and rsi.py import talib. The workspace
        # packages do not need this library.
        working-directory: .
        run: |
          curl -fsSL -o ta-lib-0.6.4-src.tar.gz https://github.com/ta-lib/ta-lib/releases/download/v0.6.4/ta-lib-0.6.4-src.tar.gz
          echo "aa04066d17d69c73b1baaef0883414d3d56ab3775872d82916d1cdb376a3ae86  ta-lib-0.6.4-src.tar.gz" | sha256sum -c -
          tar -xzf ta-lib-0.6.4-src.tar.gz
          cd ta-lib-0.6.4/
          ./configure
          make
          sudo make install
          sudo ldconfig
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Sync dependencies
        run: uv sync --all-packages --all-extras
      - name: Require workspace foreverbull packages
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path

          import foreverbull
          import foreverbull_testing

          root = Path.cwd().resolve()
          fb = Path(foreverbull.__file__).resolve()
          testing = Path(foreverbull_testing.__file__).resolve()
          print(fb)
          print(testing)
          if not fb.is_relative_to(root / "src" / "foreverbull"):
              raise SystemExit(f"foreverbull resolved outside the workspace: {fb}")
          if not testing.is_relative_to(root / "testing" / "src" / "foreverbull_testing"):
              raise SystemExit(f"foreverbull_testing resolved outside the workspace: {testing}")
          PY
      - name: Render cookiecutter templates
        id: render
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          uv run cookiecutter --output-dir "${work}/simple" templates/simple/ --replay-file templates/simple.json -f
          uv run cookiecutter --output-dir "${work}/advanced" templates/advanced/ --replay-file templates/advanced.json -f
          test -f "${work}/simple/simple/crossover.py"
          test -f "${work}/advanced/advanced/macd.py"
          echo "simple=${work}/simple/simple" >> "${GITHUB_OUTPUT}"
          echo "advanced=${work}/advanced/advanced" >> "${GITHUB_OUTPUT}"
      - name: Test simple template
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        env:
          TEMPLATE_DIR: ${{ steps.render.outputs.simple }}
        run: |
          set -euo pipefail
          test -f "${TEMPLATE_DIR}/crossover.py"
          # Replay leaves install_dependencies false, so pytest must import the
          # workspace packages from this uv env, not the git URLs in the generated file.
          PYTHONPATH="${TEMPLATE_DIR}" uv run pytest "${TEMPLATE_DIR}" \
            -c "${TEMPLATE_DIR}/pyproject.toml" \
            --rootdir="${TEMPLATE_DIR}" --confcutdir="${TEMPLATE_DIR}" -rs
      - name: Install TA-Lib Python bindings
        id: talib
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        run: |
          set -euo pipefail
          # 0.6.4 matches the C library above and publishes an sdist only.
          # It is not a workspace dependency. --no-build-isolation links the
          # venv's numpy instead of replacing it. A later uv run --with keeps
          # the package after sync, which would otherwise drop it.
          uv run --with 'ta-lib==0.6.4' --no-build-isolation-package ta-lib python -c 'import talib'
      - name: Test advanced template
        if: ${{ !cancelled() && steps.talib.outcome == 'success' }}
        env:
          TEMPLATE_DIR: ${{ steps.render.outputs.advanced }}
        run: |
          set -euo pipefail
          test -f "${TEMPLATE_DIR}/macd.py"
          PYTHONPATH="${TEMPLATE_DIR}" uv run --with 'ta-lib==0.6.4' --no-build-isolation-package ta-lib \
            pytest "${TEMPLATE_DIR}" \
            -c "${TEMPLATE_DIR}/pyproject.toml" \
            --rootdir="${TEMPLATE_DIR}" --confcutdir="${TEMPLATE_DIR}" -rs

  helm-lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4
      - name: Lint and template chart
        run: bash deploy/helm/check-chart.sh
      - name: Check server release scripts
        run: bash deploy/server/self-test.sh

  proto-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # Go generators: buf 1.26.1, protoc 27.1, protoc-gen-go v1.31.0,
      # protoc-gen-go-grpc v1.5.1. Python generation uses the buf-bin,
      # protoc-gen-py, and protoc-gen-grpc-py pins in client/taskfile.yaml.
      - name: Install protoc
        env:
          PROTOC_VERSION: "27.1"
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc "include/*"
          protoc --version
      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.26.1"
          github_token: ${{ github.token }}
      - name: Install Go protobuf plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.31.0
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v2
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - name: Generate protobuf and fail if dirty
        run: task proto:check

  build-docker-foreverbull:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Foreverbull
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ./docker/Dockerfile
          tags: ghcr.io/lhjnilsson/foreverbull:on_commit
          outputs: type=docker,dest=/tmp/foreverbull.tar
      - name: Upload foreverbull
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foreverbull
          path: /tmp/foreverbull.tar
          retention-days: 1

  build-docker-grafana:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Grafana
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: grafana
          file: ./grafana/Dockerfile
          # COPY --from=foreverbull is the repo root (go.mod and pkg/), not an image.
          build-contexts: |
            foreverbull=${{ github.workspace }}
          tags: ghcr.io/lhjnilsson/fb-grafana:on_commit
          outputs: type=docker,dest=/tmp/fb_grafana.tar
      - name: Upload Grafana
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fb-grafana
          path: /tmp/fb_grafana.tar
          retention-days: 1

  build-python-packages:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build
        run: uv build --all-packages
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: client/dist
          retention-days: 1

  build-docker-zipline:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    needs: [build-python-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Python packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: /tmp/pypi
      - name: Stage foreverbull wheel
        run: |
          set -euo pipefail
          wheel="$(find /tmp/pypi -name 'foreverbull-0.0.0-py3-none-any.whl' -print -quit)"
          test -s "${wheel}"
          cp "${wheel}" client/foreverbull-0.0.0-py3-none-any.whl
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Zipline
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: client
          file: ./client/zipline/Dockerfile
          tags: ghcr.io/lhjnilsson/zipline:on_commit
          build-args: |
            FB_WHEEL=foreverbull-0.0.0-py3-none-any.whl
          outputs: type=docker,dest=/tmp/zipline.tar
      - name: Upload zipline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zipline
          path: /tmp/zipline.tar
          retention-days: 1

  # Reuses the three image tarballs. fbenv only runs :local or the installed
  # client version, so the :on_commit tags are retagged before the test.
  # FBENV_READY_TIMEOUT covers a cold Kind node pulling Postgres, NATS, and Minio.
  # Trading stays off: no profiles file, and fbenv does not enable it.
  product-e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    needs:
      - lint-unit-tests
      - python-lint-unit-tests
      - helm-lint
      - proto-check
      - build-docker-foreverbull
      - build-docker-grafana
      - build-docker-zipline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: local
      ECHO: "true"
      FBENV_READY_TIMEOUT: "900"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Foreverbull image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foreverbull
          path: /tmp/images
      - name: Download Zipline image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zipline
          path: /tmp/images
      - name: Download Grafana image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fb-grafana
          path: /tmp/images
      - name: Load images and retag them local
        run: |
          set -euo pipefail
          docker load -i /tmp/images/foreverbull.tar
          docker load -i /tmp/images/zipline.tar
          docker load -i /tmp/images/fb_grafana.tar
          docker tag ghcr.io/lhjnilsson/foreverbull:on_commit ghcr.io/lhjnilsson/foreverbull:local
          docker tag ghcr.io/lhjnilsson/zipline:on_commit ghcr.io/lhjnilsson/zipline:local
          docker tag ghcr.io/lhjnilsson/fb-grafana:on_commit ghcr.io/lhjnilsson/fb-grafana:local
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4
      - name: Install Kind and kubectl
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kind "https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64"
          sudo install -m 755 /tmp/kind /usr/local/bin/kind
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl"
          sudo install -m 755 /tmp/kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Sync the client workspace
        working-directory: ./client
        run: uv sync --all-packages --all-extras
      - name: Run the Kind backtest
        working-directory: ./client
        run: uv run pytest ../tests/end_to_end/test_demo.py -vs
      - name: Dump the cluster
        if: failure()
        run: |
          set +e
          docker image ls 'ghcr.io/lhjnilsson/*'
          kubectl --context kind-foreverbull -n foreverbull get pods,deploy,svc,pvc -o wide
          for name in postgres nats minio zipline foreverbull grafana; do
            kubectl --context kind-foreverbull -n foreverbull describe "deployment/${name}"
            kubectl --context kind-foreverbull -n foreverbull logs "deploy/${name}" --tail=80
          done
          exit 0
