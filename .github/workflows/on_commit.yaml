name: "on commit jobs"
# Kind/Helm e2e is not run here (local: task test:integration / task env).
# Go backtest tests tagged //go:build integration call container.NewEngine
# and need a cluster; they stay off this workflow.
on:
  push:
    branches-ignore:
      - main

jobs:
  lint-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test ./pkg/... ./internal/... -coverprofile=coverage.txt -covermode=atomic -timeout 180s
        env:
          DISABLE_LOKI_LOGGING: true
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: coverage.txt

  python-lint-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies (for TA-Lib(zipline))
        working-directory: .
        run: |
          curl -L -o ta-lib-0.6.4-src.tar.gz https://github.com/ta-lib/ta-lib/releases/download/v0.6.4/ta-lib-0.6.4-src.tar.gz
          tar -xzf ta-lib-0.6.4-src.tar.gz
          cd ta-lib-0.6.4/
          ./configure
          sudo make &&
          sudo make install &&
          sudo ldconfig
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Sync dependencies
        run: uv sync --all-packages --all-extras
      - name: Lint
        run: |
          uvx ruff check
          uvx ruff format --check
          uvx pyright
      - name: Unittest
        run: |
          uv run pytest tests/
          uv run pytest zipline/
          uv run pytest cli/
          uv run pytest testing/

  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint and template chart
        run: bash deploy/helm/check-chart.sh

  build-docker-foreverbull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Foreverbull
        uses: docker/build-push-action@v6
        with:
          file: ./docker/Dockerfile
          tags: lhjnilsson/foreverbull:on_commit
          outputs: type=docker,dest=/tmp/foreverbull.tar
      - name: Upload foreverbull
        uses: actions/upload-artifact@v4
        with:
          name: foreverbull
          path: /tmp/foreverbull.tar
          retention-days: 1

  build-docker-grafana:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Grafana
        uses: docker/build-push-action@v6
        with:
          context: grafana
          file: ./grafana/Dockerfile
          tags: lhjnilsson/fb-grafana:on_commit
          outputs: type=docker,dest=/tmp/fb_grafana.tar
      - name: Upload Grafana
        uses: actions/upload-artifact@v4
        with:
          name: fb-grafana
          path: /tmp/fb_grafana.tar
          retention-days: 1

  build-python-packages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build --all-packages
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: client/dist
          retention-days: 1

  build-docker-zipline:
    needs: [build-python-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download Python packages
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: /tmp/pypi
      - name: Stage foreverbull wheel
        run: |
          set -euo pipefail
          wheel="$(find /tmp/pypi -name 'foreverbull-0.0.0-py3-none-any.whl' -print -quit)"
          test -s "${wheel}"
          cp "${wheel}" client/foreverbull-0.0.0-py3-none-any.whl
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Zipline
        uses: docker/build-push-action@v6
        with:
          context: client
          file: ./client/zipline/Dockerfile
          tags: lhjnilsson/zipline:on_commit
          build-args: |
            FB_WHEEL=foreverbull-0.0.0-py3-none-any.whl
          outputs: type=docker,dest=/tmp/zipline.tar
      - name: Upload zipline
        uses: actions/upload-artifact@v4
        with:
          name: zipline
          path: /tmp/zipline.tar
          retention-days: 1
