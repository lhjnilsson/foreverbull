name: Kind/Helm e2e

# Push to main, and workflow_dispatch. Not on every feature-branch push.
#
# Builds lhjnilsson/{foreverbull,zipline,fb-grafana}:on_commit from this
# checkout, loads them into Kind, then installs the chart with that tag.
# Docker Hub has no :latest for these images, and the release workflow that
# would publish it is separate. imagePullPolicy is IfNotPresent, so the
# loaded images are used. Postgres, NATS, and Minio stay on their chart tags.
# Trading stays off; no Alpaca secrets.
on:
  workflow_dispatch:
  push:
    branches:
      - main

# Artifacts within one run use the runner token, so no actions: write.
permissions:
  contents: read

jobs:
  build-docker-foreverbull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Foreverbull
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ./docker/Dockerfile
          tags: lhjnilsson/foreverbull:on_commit
          outputs: type=docker,dest=/tmp/foreverbull.tar
      - name: Upload foreverbull
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-foreverbull
          path: /tmp/foreverbull.tar
          retention-days: 1

  build-docker-grafana:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Grafana
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: grafana
          file: ./grafana/Dockerfile
          # COPY --from=foreverbull is the repo root (go.mod and pkg/), not an image.
          build-contexts: |
            foreverbull=${{ github.workspace }}
          tags: lhjnilsson/fb-grafana:on_commit
          outputs: type=docker,dest=/tmp/fb_grafana.tar
      - name: Upload Grafana
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-fb-grafana
          path: /tmp/fb_grafana.tar
          retention-days: 1

  build-python-packages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build
        run: uv build --all-packages
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-dist
          path: client/dist
          retention-days: 1

  build-docker-zipline:
    needs: [build-python-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Python packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-dist
          path: /tmp/pypi
      - name: Stage foreverbull wheel
        run: |
          set -euo pipefail
          wheel="$(find /tmp/pypi -name 'foreverbull-0.0.0-py3-none-any.whl' -print -quit)"
          test -s "${wheel}"
          cp "${wheel}" client/foreverbull-0.0.0-py3-none-any.whl
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Zipline
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: client
          file: ./client/zipline/Dockerfile
          tags: lhjnilsson/zipline:on_commit
          build-args: |
            FB_WHEEL=foreverbull-0.0.0-py3-none-any.whl
          outputs: type=docker,dest=/tmp/zipline.tar
      - name: Upload zipline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-zipline
          path: /tmp/zipline.tar
          retention-days: 1

  kind-helm-e2e:
    needs: [build-docker-foreverbull, build-docker-grafana, build-docker-zipline]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: on_commit
      HELM_NAMESPACE: foreverbull
      HELM_RELEASE: foreverbull
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Foreverbull image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-foreverbull
          path: /tmp/images
      - name: Download Zipline image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-zipline
          path: /tmp/images
      - name: Download Grafana image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-fb-grafana
          path: /tmp/images
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4
      - name: Create Kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: foreverbull
          version: v0.31.0
          kubectl_version: v1.35.0
          wait: 120s
      - name: Load images into Kind
        run: |
          set -euo pipefail
          docker load -i /tmp/images/foreverbull.tar
          docker load -i /tmp/images/zipline.tar
          docker load -i /tmp/images/fb_grafana.tar
          kind load docker-image \
            lhjnilsson/foreverbull:on_commit \
            lhjnilsson/zipline:on_commit \
            lhjnilsson/fb-grafana:on_commit \
            --name foreverbull
      - name: Install chart and wait for workloads
        run: bash deploy/kind/e2e.sh
