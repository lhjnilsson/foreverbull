name: security scans

# CodeQL (Go, Python), govulncheck, and Trivy. Results go to the repository's
# code scanning alerts. Nothing here fails a build or gates a release yet:
# the baseline findings are triaged first, and gating comes after that.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"  # Monday 04:17 UTC, catches advisories on unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      # Scan with the go.mod toolchain (the one docker/Dockerfile builds with),
      # not a newer one that would hide standard library findings.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # v1.1.4 is the newest govulncheck that builds with Go 1.24.
      # SARIF output reports findings without a failing exit code.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -format sarif ./... > govulncheck.sarif
      # Keep the untouched output: the steps below rewrite
      # govulncheck.sarif, and the findings must stay visible even
      # when the code-scanning upload is rejected.
      - name: Preserve raw govulncheck SARIF
        if: always()
        run: cp govulncheck.sarif govulncheck-raw.sarif
      - name: Report govulncheck findings in job summary
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import json, pathlib
          raw = pathlib.Path("govulncheck-raw.sarif")
          lines = ["## govulncheck findings (non-gating, baseline triage)", ""]
          try:
              data = json.loads(raw.read_text())
              rules = {}
              results = []
              for run in data.get("runs", []):
                  driver = run.get("tool", {}).get("driver", {})
                  for rule in driver.get("rules", []):
                      rules[rule.get("id")] = (
                          rule.get("shortDescription", {}).get("text")
                          or rule.get("fullDescription", {}).get("text")
                          or ""
                      )
                  results.extend(run.get("results", []))
              lines.append(f"govulncheck SARIF: {len(results)} results, {len(rules)} rules.")
              lines.append("")
              for rule_id in sorted(rules):
                  lines.append(f"- {rule_id}: {rules[rule_id]}")
              if not rules:
                  lines.append("- No rules in SARIF; see govulncheck-raw.sarif artifact and the Run step log.")
          except Exception as exc:
              lines.append(f"Could not parse govulncheck SARIF ({exc}); see the raw artifact and Run step log.")
          text = "\n".join(lines) + "\n"
          print(text)
          summary = pathlib.Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a") as handle:
              handle.write(text)
          PYEOF
      - name: Upload raw govulncheck SARIF artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck-sarif
          path: |
            govulncheck-raw.sarif
            govulncheck.sarif
          if-no-files-found: warn
      # v1.1.4 can emit the same call stack twice in one result, which
      # the SARIF validator rejects (uniqueItems on results[].stacks).
      # Drop exact duplicates so the findings still reach code scanning.
      - name: Drop duplicate stacks from govulncheck SARIF
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import json, pathlib
          path = pathlib.Path("govulncheck.sarif")
          data = json.loads(path.read_text())
          for run in data.get("runs", []):
              for result in run.get("results", []):
                  stacks = result.get("stacks")
                  if not stacks:
                      continue
                  seen, unique = set(), []
                  for stack in stacks:
                      key = json.dumps(stack, sort_keys=True)
                      if key not in seen:
                          seen.add(key)
                          unique.append(stack)
                  result["stacks"] = unique
          path.write_text(json.dumps(data))
          PYEOF
      # Non-gating while the baseline is triaged, like Trivy
      # (exit-code "0") and CodeQL (findings do not fail the job):
      # a rejected or unuploadable SARIF must not fail the PR.
      - name: Upload results
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  trivy-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Lockfiles, Dockerfiles, the Helm chart, and committed secrets.
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-repo.sarif
          exit-code: "0"
      - name: Upload results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo

  # Builds this commit's images and scans them. Nothing is pushed. Base images
  # change without a commit, so this runs weekly too. Not on pull requests:
  # three image builds are slow, and on_commit already builds them there.
  trivy-images:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: foreverbull
            context: .
            file: ./docker/Dockerfile
          - name: zipline
            context: client
            file: ./client/zipline/Dockerfile
          - name: fb-grafana
            context: grafana
            file: ./grafana/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        if: matrix.name == 'zipline'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Stage foreverbull wheel
        if: matrix.name == 'zipline'
        working-directory: ./client
        run: |
          set -euo pipefail
          uv build --package foreverbull --wheel --out-dir /tmp/pypi
          wheel="$(find /tmp/pypi -name 'foreverbull-0.0.0-py3-none-any.whl' -print -quit)"
          test -s "${wheel}"
          cp "${wheel}" foreverbull-0.0.0-py3-none-any.whl
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # Grafana: COPY --from=foreverbull is the repo root, not an image.
          build-contexts: |
            foreverbull=${{ github.workspace }}
          build-args: |
            FB_WHEEL=foreverbull-0.0.0-py3-none-any.whl
          tags: lhjnilsson/${{ matrix.name }}:scan
          load: true
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: lhjnilsson/${{ matrix.name }}:scan
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
      - name: Upload results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.name }}
