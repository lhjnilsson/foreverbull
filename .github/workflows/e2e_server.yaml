name: server e2e

# Push to main publishes multi-arch images to public GHCR, exercises that
# digest in an ephemeral namespace, and only then moves the latest tag and
# the fb-nightly Helm release together. A manual run does not build: it
# points latest and fb-nightly at an existing digest.
#
# on_merge.yaml stays disabled and is not this path. Kind e2e and the commit
# workflow stay the checks that gate a merge.
#
# Publish stays inert until the e2e environment has its secrets. Jobs that
# push or deploy fail before docker push and before helm when those secrets
# are empty. The environment must not require a reviewer; this channel has
# no manual approval. Branch protection is configured in Settings, not here.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      foreverbull_digest:
        description: "sha256 digest for foreverbull. Leave all three empty to use the previous Helm revision."
        required: false
        type: string
      zipline_digest:
        description: "sha256 digest for zipline. Set all three, or none."
        required: false
        type: string
      grafana_digest:
        description: "sha256 digest for fb-grafana. Set all three, or none."
        required: false
        type: string

# A newer main push waits. GitHub keeps the in-progress run and the latest
# queued run; an older run that has not started yet is dropped.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-python:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build
        run: uv build --all-packages
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-dist
          path: client/dist
          retention-days: 1

  build-foreverbull:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: e2e
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.record.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the e2e environment secrets
        env:
          E2E_KUBECONFIG: ${{ secrets.E2E_KUBECONFIG }}
          E2E_SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
          E2E_SSH_KNOWN_HOSTS: ${{ secrets.E2E_SSH_KNOWN_HOSTS }}
          E2E_SSH_HOST: ${{ secrets.E2E_SSH_HOST }}
          E2E_SSH_USER: ${{ secrets.E2E_SSH_USER }}
        run: bash deploy/server/require-secrets.sh
      - name: Name the image
        run: bash deploy/server/image-ref.sh foreverbull >> "$GITHUB_ENV"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse the sha tag when this commit already published it
        id: existing
        run: |
          set -euo pipefail
          result="$(bash deploy/server/ghcr.sh existing-digest "${IMAGE}" "${SHA_TAG}" "${GITHUB_SHA}")"
          if [[ "${result}" == "absent" ]]; then
            echo "state=absent" >> "${GITHUB_OUTPUT}"
          else
            [[ "${result}" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "state=present" >> "${GITHUB_OUTPUT}"
            echo "digest=${result}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Build and push foreverbull
        id: push
        if: steps.existing.outputs.state == 'absent'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ env.SHA_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            manifest:org.opencontainers.image.revision=${{ github.sha }}
          push: true
      - name: Confirm the package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/server/ghcr.sh ensure-public foreverbull
      - name: Record the digest
        id: record
        env:
          EXISTING_STATE: ${{ steps.existing.outputs.state }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          PUSH_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "${EXISTING_STATE}" == "present" ]]; then
            digest="${EXISTING_DIGEST}"
          else
            digest="${PUSH_DIGEST}"
          fi
          digest="$(printf '%s' "${digest}" | tr -d '[:space:]')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  build-grafana:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: e2e
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.record.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the e2e environment secrets
        env:
          E2E_KUBECONFIG: ${{ secrets.E2E_KUBECONFIG }}
          E2E_SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
          E2E_SSH_KNOWN_HOSTS: ${{ secrets.E2E_SSH_KNOWN_HOSTS }}
          E2E_SSH_HOST: ${{ secrets.E2E_SSH_HOST }}
          E2E_SSH_USER: ${{ secrets.E2E_SSH_USER }}
        run: bash deploy/server/require-secrets.sh
      - name: Name the image
        run: bash deploy/server/image-ref.sh fb-grafana >> "$GITHUB_ENV"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse the sha tag when this commit already published it
        id: existing
        run: |
          set -euo pipefail
          result="$(bash deploy/server/ghcr.sh existing-digest "${IMAGE}" "${SHA_TAG}" "${GITHUB_SHA}")"
          if [[ "${result}" == "absent" ]]; then
            echo "state=absent" >> "${GITHUB_OUTPUT}"
          else
            [[ "${result}" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "state=present" >> "${GITHUB_OUTPUT}"
            echo "digest=${result}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Build and push Grafana
        id: push
        if: steps.existing.outputs.state == 'absent'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: grafana
          file: ./grafana/Dockerfile
          # COPY --from=foreverbull is the repo root (go.mod and pkg/), not an image.
          build-contexts: |
            foreverbull=${{ github.workspace }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ env.SHA_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            manifest:org.opencontainers.image.revision=${{ github.sha }}
          push: true
      - name: Confirm the package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/server/ghcr.sh ensure-public fb-grafana
      - name: Record the digest
        id: record
        env:
          EXISTING_STATE: ${{ steps.existing.outputs.state }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          PUSH_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "${EXISTING_STATE}" == "present" ]]; then
            digest="${EXISTING_DIGEST}"
          else
            digest="${PUSH_DIGEST}"
          fi
          digest="$(printf '%s' "${digest}" | tr -d '[:space:]')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  build-zipline:
    if: github.event_name == 'push'
    needs: [build-python]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: e2e
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.record.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the e2e environment secrets
        env:
          E2E_KUBECONFIG: ${{ secrets.E2E_KUBECONFIG }}
          E2E_SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
          E2E_SSH_KNOWN_HOSTS: ${{ secrets.E2E_SSH_KNOWN_HOSTS }}
          E2E_SSH_HOST: ${{ secrets.E2E_SSH_HOST }}
          E2E_SSH_USER: ${{ secrets.E2E_SSH_USER }}
        run: bash deploy/server/require-secrets.sh
      - name: Download Python packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-dist
          path: /tmp/pypi
      - name: Stage foreverbull wheel
        run: |
          set -euo pipefail
          wheel="$(find /tmp/pypi -name 'foreverbull-0.0.0-py3-none-any.whl' -print -quit)"
          test -s "${wheel}"
          cp "${wheel}" client/foreverbull-0.0.0-py3-none-any.whl
      - name: Name the image
        run: bash deploy/server/image-ref.sh zipline >> "$GITHUB_ENV"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse the sha tag when this commit already published it
        id: existing
        run: |
          set -euo pipefail
          result="$(bash deploy/server/ghcr.sh existing-digest "${IMAGE}" "${SHA_TAG}" "${GITHUB_SHA}")"
          if [[ "${result}" == "absent" ]]; then
            echo "state=absent" >> "${GITHUB_OUTPUT}"
          else
            [[ "${result}" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "state=present" >> "${GITHUB_OUTPUT}"
            echo "digest=${result}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Build and push Zipline
        id: push
        if: steps.existing.outputs.state == 'absent'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: client
          file: ./client/zipline/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ env.SHA_TAG }}
          build-args: |
            FB_WHEEL=foreverbull-0.0.0-py3-none-any.whl
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            manifest:org.opencontainers.image.revision=${{ github.sha }}
          push: true
      - name: Confirm the package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/server/ghcr.sh ensure-public zipline
      - name: Record the digest
        id: record
        env:
          EXISTING_STATE: ${{ steps.existing.outputs.state }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          PUSH_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "${EXISTING_STATE}" == "present" ]]; then
            digest="${EXISTING_DIGEST}"
          else
            digest="${PUSH_DIGEST}"
          fi
          digest="$(printf '%s' "${digest}" | tr -d '[:space:]')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  server-e2e:
    if: github.event_name == 'push'
    needs: [build-foreverbull, build-grafana, build-zipline]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: e2e
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the e2e environment secrets
        env:
          E2E_KUBECONFIG: ${{ secrets.E2E_KUBECONFIG }}
          E2E_SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
          E2E_SSH_KNOWN_HOSTS: ${{ secrets.E2E_SSH_KNOWN_HOSTS }}
          E2E_SSH_HOST: ${{ secrets.E2E_SSH_HOST }}
          E2E_SSH_USER: ${{ secrets.E2E_SSH_USER }}
        run: bash deploy/server/require-secrets.sh
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4
      - name: Install kubectl
        run: bash deploy/server/ci-tools.sh
      - name: Name the namespace
        run: |
          set -euo pipefail
          lines="$(bash deploy/server/image-ref.sh)"
          printf '%s\n' "${lines}" >> "${GITHUB_ENV}"
          short="$(sed -n 's/^SHORT_SHA=//p' <<<"${lines}")"
          [[ "${short}" =~ ^[0-9a-f]{7}$ ]]
          echo "NAMESPACE=e2e-${short}" >> "${GITHUB_ENV}"
      - name: Open cluster access
        env:
          E2E_KUBECONFIG: ${{ secrets.E2E_KUBECONFIG }}
          E2E_SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
          E2E_SSH_KNOWN_HOSTS: ${{ secrets.E2E_SSH_KNOWN_HOSTS }}
          E2E_SSH_HOST: ${{ secrets.E2E_SSH_HOST }}
          E2E_SSH_USER: ${{ secrets.E2E_SSH_USER }}
          E2E_SSH_PORT: ${{ secrets.E2E_SSH_PORT }}
          E2E_SSH_REMOTE_PORT: ${{ secrets.E2E_SSH_REMOTE_PORT }}
        run: bash deploy/server/session.sh start
      - name: Check the credential can install a release
        run: bash deploy/server/session.sh preflight
      - name: Install the ephemeral release
        env:
          FOREVERBULL_DIGEST: ${{ needs.build-foreverbull.outputs.digest }}
          ZIPLINE_DIGEST: ${{ needs.build-zipline.outputs.digest }}
          GRAFANA_DIGEST: ${{ needs.build-grafana.outputs.digest }}
          WAIT_TIMEOUT: 30m
        run: bash deploy/server/install.sh
      - name: Delete the ephemeral namespace
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail
          [[ "${NAMESPACE}" =~ ^e2e-[0-9a-f]{7}$ ]]
          kubectl delete namespace "${NAMESPACE}" --wait=false
      - name: Close cluster access
        if: always()
        run: bash deploy/server/session.sh stop

  promote:
    if: github.event_name == 'push' && needs.server-e2e.result == 'success'
    needs: [build-foreverbull, build-grafana, build-zipline, server-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: e2e
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the e2e environment secrets
        env:
          E2E_KUBECONFIG: ${{ secrets.E2E_KUBECONFIG }}
          E2E_SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
          E2E_SSH_KNOWN_HOSTS: ${{ secrets.E2E_SSH_KNOWN_HOSTS }}
          E2E_SSH_HOST: ${{ secrets.E2E_SSH_HOST }}
          E2E_SSH_USER: ${{ secrets.E2E_SSH_USER }}
        run: bash deploy/server/require-secrets.sh
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4
      - name: Install kubectl
        run: bash deploy/server/ci-tools.sh
      - name: Name the images
        run: bash deploy/server/image-ref.sh >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Open cluster access
        env:
          E2E_KUBECONFIG: ${{ secrets.E2E_KUBECONFIG }}
          E2E_SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
          E2E_SSH_KNOWN_HOSTS: ${{ secrets.E2E_SSH_KNOWN_HOSTS }}
          E2E_SSH_HOST: ${{ secrets.E2E_SSH_HOST }}
          E2E_SSH_USER: ${{ secrets.E2E_SSH_USER }}
          E2E_SSH_PORT: ${{ secrets.E2E_SSH_PORT }}
          E2E_SSH_REMOTE_PORT: ${{ secrets.E2E_SSH_REMOTE_PORT }}
        run: bash deploy/server/session.sh start
      - name: Check the credential can install a release
        run: bash deploy/server/session.sh preflight
      - name: Move latest and roll fb-nightly together
        env:
          NAMESPACE: fb-nightly
          FOREVERBULL_DIGEST: ${{ needs.build-foreverbull.outputs.digest }}
          ZIPLINE_DIGEST: ${{ needs.build-zipline.outputs.digest }}
          GRAFANA_DIGEST: ${{ needs.build-grafana.outputs.digest }}
          GRAFANA_URL: https://nightly.foreverbull.com
          WAIT_TIMEOUT: 30m
        run: bash deploy/server/retarget.sh
      - name: Close cluster access
        if: always()
        run: bash deploy/server/session.sh stop

  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: e2e
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the e2e environment secrets
        env:
          E2E_KUBECONFIG: ${{ secrets.E2E_KUBECONFIG }}
          E2E_SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
          E2E_SSH_KNOWN_HOSTS: ${{ secrets.E2E_SSH_KNOWN_HOSTS }}
          E2E_SSH_HOST: ${{ secrets.E2E_SSH_HOST }}
          E2E_SSH_USER: ${{ secrets.E2E_SSH_USER }}
        run: bash deploy/server/require-secrets.sh
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4
      - name: Install kubectl
        run: bash deploy/server/ci-tools.sh
      - name: Name the images
        run: bash deploy/server/image-ref.sh >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Open cluster access
        env:
          E2E_KUBECONFIG: ${{ secrets.E2E_KUBECONFIG }}
          E2E_SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
          E2E_SSH_KNOWN_HOSTS: ${{ secrets.E2E_SSH_KNOWN_HOSTS }}
          E2E_SSH_HOST: ${{ secrets.E2E_SSH_HOST }}
          E2E_SSH_USER: ${{ secrets.E2E_SSH_USER }}
          E2E_SSH_PORT: ${{ secrets.E2E_SSH_PORT }}
          E2E_SSH_REMOTE_PORT: ${{ secrets.E2E_SSH_REMOTE_PORT }}
        run: bash deploy/server/session.sh start
      - name: Check the credential can install a release
        run: bash deploy/server/session.sh preflight
      - name: Retarget latest and fb-nightly without rebuilding
        env:
          NAMESPACE: fb-nightly
          FOREVERBULL_DIGEST: ${{ inputs.foreverbull_digest }}
          ZIPLINE_DIGEST: ${{ inputs.zipline_digest }}
          GRAFANA_DIGEST: ${{ inputs.grafana_digest }}
          GRAFANA_URL: https://nightly.foreverbull.com
          WAIT_TIMEOUT: 30m
        run: bash deploy/server/rollback.sh
      - name: Close cluster access
        if: always()
        run: bash deploy/server/session.sh stop
