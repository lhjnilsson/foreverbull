name: pull request authorship

# Flags a pull request whose author is not the author of its commits. A bot
# must open its own pull requests: one opened under a person's account cannot
# be edited by the bot that wrote the commits. Mixed authorship is a warning;
# it fails only when a bot account is on one side of the mismatch. A verified
# "Update branch" merge committed by GitHub is skipped; see
# .github/scripts/pr_authorship.sh.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  authorship:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test authorship rules against fixtures
        run: .github/scripts/test_pr_authorship.sh
      - name: Compare pull request and commit authors
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BOT_LOGINS: lhjnilsson-bot
        run: |
          set -euo pipefail
          commits_json="${RUNNER_TEMP}/pr_commits.json"
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" > "${commits_json}"
          .github/scripts/pr_authorship.sh "${commits_json}"
