# Dependency updates. One weekly batch per ecosystem keeps the PR queue small.
# Every ecosystem checks on Monday at 06:00 UTC.
# Security updates are separate: they follow Dependabot alerts in repo Settings.
# Alerts only, with no automatic security pull request, is that Settings toggle, not this file.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /grafana/lhjnilsson-foreverbull-datasource
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    groups:
      gomod:
        applies-to: version-updates
        patterns: ["*"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: uv
    directory: /client
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    groups:
      python:
        applies-to: version-updates
        patterns: ["*"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directories:
      - /docker
      - /client
      - /grafana
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    groups:
      docker:
        applies-to: version-updates
        patterns: ["*"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 2

  # Zipline base fails on python 3.15-trixie (amd64+arm64); hold minor/major until Zipline supports 3.15
  - package-ecosystem: docker
    directory: /client/zipline
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    groups:
      docker:
        applies-to: version-updates
        patterns: ["*"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: python
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /grafana/lhjnilsson-foreverbull-datasource
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    # typescript-eslint peer still requires typescript <6.1; hold majors until eslint supports 7
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2
