{{- include "foreverbull.validate" . }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "foreverbull.serviceAccountName" . }}
  labels:
    {{- include "foreverbull.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "foreverbull.serviceAccountName" . }}
automountServiceAccountToken: true
{{- end }}
