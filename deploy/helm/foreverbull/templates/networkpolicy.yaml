{{- /* Service pods are created by the broker, not by this chart. They carry platform=foreverbull and type=service. */ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: service-pod
  labels:
    {{- include "foreverbull.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      platform: foreverbull
      type: service
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: foreverbull
      ports:
        - protocol: TCP
          port: {{ .Values.broker.grpcPort }}
        - protocol: TCP
          port: {{ .Values.broker.backtestPortStart }}
          endPort: {{ .Values.broker.backtestPortEnd }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
---
{{/* Grafana dials the broker in plaintext. It may reach only DNS and that gRPC port. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  labels:
    {{- include "foreverbull.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: foreverbull
      ports:
        - protocol: TCP
          port: {{ .Values.broker.grpcPort }}
