{{- $sel := dict "name" "zipline" "root" . }}
apiVersion: v1
kind: Service
metadata:
  name: zipline
  labels:
    {{- include "foreverbull.labels" . | nindent 4 }}
    {{- include "foreverbull.selectorLabels" $sel | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "foreverbull.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.zipline.grpcPort }}
      targetPort: grpc
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipline
  labels:
    {{- include "foreverbull.labels" . | nindent 4 }}
    {{- include "foreverbull.selectorLabels" $sel | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "foreverbull.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "foreverbull.labels" . | nindent 8 }}
        {{- include "foreverbull.selectorLabels" $sel | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "foreverbull.appPodSecurityContext" (dict "runAsUser" 10001) | nindent 8 }}
      containers:
        - name: zipline
          image: {{ include "foreverbull.appImage" (list .Values.images.zipline.repository .Values.images.zipline.tag .Values.global.imageTag .Values.global.imageRepository) }}
          imagePullPolicy: {{ .Values.global.appImagePullPolicy }}
          securityContext:
            {{- include "foreverbull.appContainerSecurityContext" (dict "runAsUser" 10001) | nindent 12 }}
          ports:
            - name: grpc
              containerPort: {{ .Values.zipline.grpcPort }}
              protocol: TCP
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "foreverbull.credentialsSecretName" . }}
                  key: postgres-password
            - name: DATABASE_URL
              value: {{ include "foreverbull.postgresURL" . | quote }}
          startupProbe:
            exec:
              command: ["grpc_health_probe", {{ printf "-addr=:%v" .Values.zipline.grpcPort | quote }}]
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["grpc_health_probe", {{ printf "-addr=:%v" .Values.zipline.grpcPort | quote }}]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["grpc_health_probe", {{ printf "-addr=:%v" .Values.zipline.grpcPort | quote }}]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources.zipline | nindent 12 }}
