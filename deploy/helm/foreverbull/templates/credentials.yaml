{{- /* Postgres and MinIO credentials. See credentials in values.yaml. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "foreverbull.credentialsSecretName" . }}
  labels:
    {{- include "foreverbull.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ include "foreverbull.credential" (list . "postgres.password" .Values.postgres.password "foreverbull" "" true) | b64enc | quote }}
  worker-postgres-password: {{ include "foreverbull.credential" (list . "worker.postgres-password" .Values.postgres.workerPassword "foreverbull-worker" "" true) | b64enc | quote }}
  minio-accessKey: {{ include "foreverbull.credential" (list . "minio.accessKey" .Values.minio.accessKey "minioadmin" "foreverbull" false) | b64enc | quote }}
  minio-secretKey: {{ include "foreverbull.credential" (list . "minio.secretKey" .Values.minio.secretKey "minioadmin" "" true) | b64enc | quote }}
