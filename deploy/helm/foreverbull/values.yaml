# Default values for the Foreverbull platform chart.
# Keys under global/images/expose/persistence/postgres/nats/minio/broker/grafana/
# serviceAccount/rbac match deploy/README.md. Do not rename them.

replicaCount: 1

global:
  imageRepository: lhjnilsson  # prefix for the three app images; fbenv passes its IMAGE_REPOSITORY here
  imageTag: latest          # fbenv sets the client version, or local
  imagePullPolicy: IfNotPresent

images:
  postgres:
    repository: postgres
    tag: 13.3-alpine
  nats:
    repository: nats
    tag: 2.10-alpine
  minio:
    # Anonymous pulls of the MinIO community image fail (Docker Hub removed
    # minio/minio; quay.io/minio/minio returns 401). Silo keeps the S3 API,
    # MINIO_ROOT_* env, `server` command, and /minio/health/live probe.
    repository: pgsty/silo
    tag: RELEASE.2026-09-16T00-00-00Z
  broker:
    repository: foreverbull  # short name → global.imageRepository/foreverbull; a name with "/" is used as-is
    tag: ""                 # empty → global.imageTag
  zipline:
    repository: zipline
    tag: ""
  grafana:
    repository: fb-grafana
    tag: ""

expose:
  hostPort: false           # local CLI sets true; remote leaves false

persistence:
  enabled: true
  postgres:
    size: 8Gi
    path: /pgdata
  nats:
    size: 1Gi
    path: /var/lib/nats/data
  minio:
    size: 8Gi
    path: /data

# Postgres and MinIO credentials live in Secret foreverbull-credentials.
# Leave password/accessKey/secretKey empty and the chart picks them:
#   - credentials.allowDefaults=true (fbenv passes it for local Kind):
#     the documented local credentials, foreverbull and
#     minioadmin/minioadmin, so host tools work. expose.hostPort is
#     networking only and never selects these defaults on its own.
#   - otherwise: generated once and kept in the Secret across upgrades.
# Setting a value yourself wins. postgres.password and minio.secretKey
# must be URL-safe (letters, digits and -._~): the Postgres password is
# expanded raw into POSTGRES_URL, and a non-URL-safe set value fails the
# install. A set public default also fails unless allowDefaults is true.
credentials:
  allowDefaults: false      # true only for local Kind or a throwaway cluster

postgres:
  user: foreverbull
  password: ""
  # Password for role foreverbull_worker (SELECT on asset, ohlc, asset_symbol).
  # Empty follows the same rule as postgres.password: the local default when
  # credentials.allowDefaults=true, otherwise generated into the Secret.
  # The broker applies it. Service pods do not receive it.
  workerPassword: ""
  database: foreverbull
  port: 5432

nats:
  port: 4222
  monitorPort: 8222
  jetstream: true           # command: -js -sd /var/lib/nats/data -m 8222

minio:
  port: 9000
  consolePort: 9001
  accessKey: ""
  secretKey: ""
  command: 'server --console-address ":9001" /data'

broker:
  grpcPort: 50055
  httpPort: 8080
  backtestPortStart: 27000
  backtestPortEnd: 27015
  logLevel: warning
  serverAddress: foreverbull
  ziplineServiceName: zipline
  trading:
    # TRADING_ENABLED. Credentials are Secret foreverbull-trading, not chart values.
    enabled: false

zipline:
  grpcPort: 50055

grafana:
  port: 3000
  brokerUrl: foreverbull:50055
  url: http://localhost:3000  # GRAFANA_URL on the broker; Kind host port

serviceAccount:
  create: true
  name: foreverbull

rbac:
  create: true

# Modest requests for a local Kind node. Limits omitted so the node can burst.
resources:
  postgres:
    requests:
      cpu: 50m
      memory: 64Mi
  nats:
    requests:
      cpu: 25m
      memory: 32Mi
  minio:
    requests:
      cpu: 50m
      memory: 64Mi
  zipline:
    requests:
      cpu: 50m
      memory: 128Mi
  broker:
    requests:
      cpu: 50m
      memory: 128Mi
  grafana:
    requests:
      cpu: 50m
      memory: 128Mi
