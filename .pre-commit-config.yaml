repos:
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      # - id: go-fmt
      # - id: go-vet
      # - id: go-imports
      # - id: go-cyclo
      # args: [-over=15]
      # - id: no-go-testing
      - id: golangci-lint
      # - id: go-critic
      - id: go-build
      - id: go-mod-tidy

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pin matches CI (`uvx ruff@0.17.0`) and client/taskfile.yaml.
    # Whole client tree, same commands CI runs.
    rev: v0.17.0
    hooks:
      - id: ruff
        name: lint client with ruff
        args: ["client"]
        pass_filenames: false
        files: ^client/
      - id: ruff-format
        name: check client formatting with ruff
        args: ["--check", "client"]
        pass_filenames: false
        files: ^client/

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.4
    hooks:
      - id: uv-lock
        args: ["--directory", "client"]
        files: ^client/(uv\.lock|pyproject\.toml|cli/pyproject\.toml|testing/pyproject\.toml|zipline/pyproject\.toml)$

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.384
    hooks:
      - id: pyright

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint
