repos:
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      # - id: go-fmt
      # - id: go-vet
      # - id: go-imports
      # - id: go-cyclo
      # args: [-over=15]
      # - id: no-go-testing
      - id: golangci-lint
      # - id: go-critic
      - id: go-build
      - id: go-mod-tidy

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: lint with ruff
        args: [--fix]
        exclude: '^client/templates/.*'
      - id: ruff
        name: sort imports with ruff
        args: [--select, I, --fix]
        exclude: '^client/templates/.*'
      - id: ruff-format
        exclude: '^client/templates/.*'

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.4
    hooks:
      - id: uv-lock
        args: ["--directory", "client"]
        files: ^client/(uv\.lock|pyproject\.toml|cli/pyproject\.toml|testing/pyproject\.toml|zipline/pyproject\.toml)$

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.384
    hooks:
      - id: pyright

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint
