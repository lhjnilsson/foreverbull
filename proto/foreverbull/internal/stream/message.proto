syntax = "proto3";

package foreverbull.internal.stream;

import "foreverbull/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lhjnilsson/foreverbull/internal/stream/pb";

message Message {
  string id = 1;
  string module = 2;
  string component = 3;
  string method = 4;
  bytes payload = 5;

  optional string orchestration_name = 6;
  optional string orchestration_id = 7;
  optional string orchestration_step = 8;
  optional int32 orchestration_step_number = 9;
  optional bool orchestration_fallback_step = 10;
}

message State {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_CREATED = 1;
    STATE_PUBLISHED = 2;
    STATE_RECEIVED = 3;
    STATE_COMPLETED = 4;
    STATE_ERROR = 5;
    STATE_CANCELED = 6;
  }
  State state = 1;
  // Set only when the command failed (STATE_ERROR). A completed command
  // never carries an error.
  optional string error = 2;
  google.protobuf.Timestamp occurred_at = 3;
  // Lines the user must read although the command completed, such as
  // sessions the ingest filled with the previous close.
  repeated string notices = 4;
}

// Progress is one report on TOPIC_TASK_PROGRESS. It is not a task state.
message Progress {
  string text = 1;
  // Set while a price provider is limiting requests. The next report leaves
  // them empty once the download continues.
  string rate_limit_provider = 2;
  int32 rate_limit_wait_seconds = 3;
}

message Orchestration {
  message Step {
    int32 num = 1;
    repeated Message messages = 2;
    foreverbull.common.State state = 3;
    // Set only when the step failed. On a running step it is progress text.
    optional string error = 4;
    // Notices of the step's commands that completed with one.
    repeated string notices = 5;
    // Copied onto the running step while a price provider is limiting
    // requests. Empty on the next progress report without a wait.
    string rate_limit_provider = 6;
    int32 rate_limit_wait_seconds = 7;
  }
  repeated Step steps = 1;
}
