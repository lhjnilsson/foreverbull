syntax = "proto3";

package foreverbull.backtest.service.v1;

import "buf/validate/validate.proto";
import "foreverbull/backtest/v1/backtest.proto";
import "foreverbull/backtest/v1/execution.proto";
import "foreverbull/backtest/v1/session.proto";
import "foreverbull/common.proto";

option go_package = "github.com/lhjnilsson/foreverbull/pkg/pb/backtest/service";

message ListBacktestsRequest {}

message ListBacktestsResponse {
  repeated foreverbull.backtest.v1.Backtest backtests = 1;
}

message CreateBacktestRequest {
  message CreateFromETF {
    string name = 1;
    foreverbull.common.Date start_date = 2;
    foreverbull.common.Date end_date = 3;
    string base_etf = 4;
    // yahoo, stooq, or alpaca. Empty means yahoo.
    string provider = 5;
    // Profile name when provider is alpaca. Ignored for yahoo and stooq.
    string profile = 6;
  }
  message CreateFromBacktest {
    foreverbull.backtest.v1.Backtest backtest = 1;
  }

  oneof create {
    CreateFromETF etf = 1;
    CreateFromBacktest backtest = 2;
  }
}

message CreateBacktestResponse {
  foreverbull.common.Step CREATING = 1;
  foreverbull.common.Step DOWNLOADING = 2;
  foreverbull.common.Step INGESTING = 3;
  foreverbull.common.Step STORING = 4;

  foreverbull.backtest.v1.Backtest backtest = 5;
}

message GetBacktestRequest {
  string name = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "required"
      expression: "this != ''"
    }
  }];
}

message GetBacktestResponse {
  string name = 1;
  foreverbull.backtest.v1.Backtest backtest = 2;
}

message DeleteBacktestRequest {
  string name = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "required"
      expression: "this != ''"
    }
  }];
}

message DeleteBacktestResponse {}

message CreateSessionRequest {
  string backtest_name = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "required"
      expression: "this != ''"
    }
  }];
}

message CreateSessionResponse {
  foreverbull.common.Step CREATING = 1;
  foreverbull.common.Step STARTING = 2;
  foreverbull.common.Step STORING = 3;

  foreverbull.backtest.v1.Session session = 4;
}

message GetSessionRequest {
  string session_id = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "required"
      expression: "this != ''"
    }
  }];
}

message GetSessionResponse {
  foreverbull.backtest.v1.Session session = 1;
}

message ListExecutionsRequest {
  string backtest = 1;
  string session_id = 2;
}

message ListExecutionsResponse {
  repeated foreverbull.backtest.v1.Execution executions = 1;
}

message GetExecutionRequest {
  string execution_id = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "required"
      expression: "this != ''"
    }
  }];
}

message GetExecutionResponse {
  foreverbull.backtest.v1.Execution execution = 1;
  repeated foreverbull.backtest.v1.Period periods = 2;
  // functions were stored at create time. Empty when the run has none.
  repeated foreverbull.backtest.v1.ExecutionFunction functions = 3;
  // Read from the backtest's current universe_member rows when this response
  // is built, not stored with the run.
  foreverbull.backtest.v1.UniverseSource universe_source = 4;
  // True only when universe_source is ETF and no universe_member interval
  // covers any date of the execution's [start_date, end_date]. False when the
  // universe had a member on at least one of those dates, or when it is not
  // known.
  bool universe_empty = 5;
}

service BacktestServicer {
  rpc ListBacktests(ListBacktestsRequest) returns (ListBacktestsResponse) {}
  rpc CreateBacktest(CreateBacktestRequest) returns (stream CreateBacktestResponse) {}
  rpc GetBacktest(GetBacktestRequest) returns (GetBacktestResponse) {}
  rpc DeleteBacktest(DeleteBacktestRequest) returns (DeleteBacktestResponse) {}
  rpc CreateSession(CreateSessionRequest) returns (stream CreateSessionResponse) {}
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {}
  rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsResponse) {}
  rpc GetExecution(GetExecutionRequest) returns (GetExecutionResponse) {}
}
