syntax = "proto3";

package foreverbull.backtest.service.v1;

import "buf/validate/validate.proto";
import "foreverbull/backtest/v1/execution.proto";
import "foreverbull/common.proto";
import "foreverbull/finance/v1/marketdata.proto";
import "foreverbull/service/v1/worker.proto";

option go_package = "github.com/lhjnilsson/foreverbull/pkg/pb/backtest/service";

message CreateExecutionRequest {
  string id = 1;
  string session = 2;
  foreverbull.common.Date start_date = 3 [(buf.validate.field) = {}];
  foreverbull.common.Date end_date = 4 [(buf.validate.field) = {}];

  foreverbull.service.v1.Algorithm algorithm = 5 [(buf.validate.field) = {
    required: true
    cel: {
      id: "required_algo"
      expression: "this != null"
    }
  }];
}

message CreateExecutionResponse {
  foreverbull.backtest.v1.Execution execution = 1;
  foreverbull.service.v1.ExecutionConfiguration configuration = 2;
}

message RunExecutionRequest {
  string execution_id = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "required"
      expression: "this != ''"
    }
  }];
}

message RunExecutionResponse {
  foreverbull.backtest.v1.Execution execution = 1;
  foreverbull.finance.v1.Portfolio portfolio = 2;
  int64 num_total_periods = 3;
  int64 num_current_period = 4;
}

message StoreExecutionResultRequest {
  string execution_id = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "required"
      expression: "this != ''"
    }
  }];
}

message StoreExecutionResultResponse {}

message StopServerRequest {}

message StopServerResponse {}

service SessionServicer {
  rpc CreateExecution(CreateExecutionRequest) returns (CreateExecutionResponse) {}
  rpc RunExecution(RunExecutionRequest) returns (stream RunExecutionResponse) {}
  rpc StoreResult(StoreExecutionResultRequest) returns (StoreExecutionResultResponse) {}
  rpc StopServer(StopServerRequest) returns (StopServerResponse) {}
}
