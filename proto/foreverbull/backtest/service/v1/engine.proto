syntax = "proto3";

package foreverbull.backtest.service.v1;

import "foreverbull/backtest/v1/backtest.proto";
import "foreverbull/backtest/v1/execution.proto";
import "foreverbull/finance/v1/marketdata.proto";

option go_package = "github.com/lhjnilsson/foreverbull/pkg/pb/backtest/service";

message DownloadIngestionRequest {
  string bucket = 1;
  string object = 2;
}

message DownloadIngestionResponse {}

message IngestRequest {
  backtest.v1.Backtest backtest = 1;
  optional string bucket = 2;
  optional string object = 3;
}

message IngestResponse {}

message NewSessionRequest {
  string id = 1;
}

message NewSessionResponse {
  int64 port = 1;
}

message RunBacktestRequest {
  foreverbull.backtest.v1.Execution execution = 1;
  string benchmark = 2;
}

message RunBacktestResponse {
  foreverbull.backtest.v1.Execution execution = 1;
  int64 num_periods = 2;
}

message GetCurrentPeriodRequest {}

message GetCurrentPeriodResponse {
  bool is_running = 1;
  optional foreverbull.finance.v1.Portfolio portfolio = 2;
}

message PlaceOrdersAndContinueRequest {
  repeated foreverbull.finance.v1.Order orders = 1;
}

message PlaceOrdersAndContinueResponse {}

message GetResultRequest {
  message Upload {
    string bucket = 1;
    string object = 2;
  }
  string execution = 1;
  optional Upload upload = 2;
}

message GetResultResponse {
  repeated foreverbull.backtest.v1.Period periods = 1;
}

service Engine {
  rpc DownloadIngestion(DownloadIngestionRequest) returns (DownloadIngestionResponse) {}
  rpc Ingest(IngestRequest) returns (IngestResponse) {}
  rpc NewSession(NewSessionRequest) returns (NewSessionResponse) {}
}

service EngineSession {
  rpc RunBacktest(RunBacktestRequest) returns (RunBacktestResponse) {}
  rpc GetCurrentPeriod(GetCurrentPeriodRequest) returns (GetCurrentPeriodResponse) {}
  rpc PlaceOrdersAndContinue(PlaceOrdersAndContinueRequest) returns (PlaceOrdersAndContinueResponse) {}
  rpc GetResult(GetResultRequest) returns (GetResultResponse) {}
}
