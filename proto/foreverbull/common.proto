syntax = "proto3";

package foreverbull.common;

option go_package = "github.com/lhjnilsson/foreverbull/pkg/pb";

message Request {
  string task = 1;
  optional bytes data = 2;
}

message Response {
  string task = 1;
  optional bytes data = 2;
  optional string error = 3;
}

message Date {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
}

enum State {
  STATE_UNSPECIFIED = 0;
  STATE_RUNNING = 1;
  STATE_COMPLETED = 2;
  STATE_FAILED = 3;
}

message Step {
  State state = 1;
  // Why the step failed. Empty unless state is STATE_FAILED.
  string message = 2;
  // Lines the user must read although the step completed, such as prices
  // the ingest filled. A client that does not know this field ignores it.
  repeated string notices = 3;
}
