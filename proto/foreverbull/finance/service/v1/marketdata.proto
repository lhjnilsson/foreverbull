syntax = "proto3";

package foreverbull.finance.service.v1;

import "buf/validate/validate.proto";
import "foreverbull/common.proto";
import "foreverbull/finance/v1/marketdata.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lhjnilsson/foreverbull/pkg/pb/finance/service";

message GetAssetRequest {
  oneof identifier {
    string symbol = 1;
    string isin = 2;
  }
}

message GetAssetResponse {
  foreverbull.finance.v1.Asset asset = 1;
}

message GetIndexRequest {
  string symbol = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "symbol_required"
      expression: "this != ''"
    }
  }];
}

message GetIndexResponse {
  repeated foreverbull.finance.v1.Asset assets = 1;
}

message DownloadHistoricalDataRequest {
  // At most 10,000 distinct symbols per request (MaxDownloadSymbols in
  // pkg/finance); the service counts them after leaving out repeats. This
  // raw bound is twice that, so repeats still fit, and stops an oversized
  // list before the service reads it.
  repeated string symbols = 1 [(buf.validate.field).repeated.max_items = 20000];
  foreverbull.common.Date start_date = 2 [(buf.validate.field) = {
    required: true
    cel: {
      id: "date_required"
      expression: "this != null"
    }
  }];
  foreverbull.common.Date end_date = 3;
  // yahoo, stooq, or alpaca. Empty means yahoo.
  string provider = 4;
  // Profile name when provider is alpaca. Ignored for yahoo and stooq.
  string profile = 5;
  // session_cutoff is the last completed XNYS session from the broker's one
  // clock reading. When set, a fetch stores no later session and does not
  // read the clock to choose another cutoff. Unset keeps the provider clock,
  // for a caller that is not that reading.
  foreverbull.common.Date session_cutoff = 6;
}

message DownloadHistoricalDataResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
    STATUS_ERROR = 2;
  }
  // ProviderStatus is the price provider's HTTP error status for the
  // symbol's bars, after the provider's bounded retries.
  message ProviderStatus {
    string provider = 1;
    int32 http_status = 2;
  }
  string symbol = 1;
  Status status = 2;
  string error = 3;
  // provider_status is set with STATUS_ERROR when the provider answered
  // with an error status. Callers name the cause from it, not from error.
  ProviderStatus provider_status = 4;
  // LaterTicker is another ticker of the symbol's ISIN that held its bars
  // because the provider had none under symbol, such as FB read as META.
  // It names no day: the provider doesn't say when the ticker changed.
  message LaterTicker {
    // symbol is the ticker the bars were read and stored under.
    string symbol = 1;
  }
  // later_ticker is set with STATUS_OK when the bars came from a later
  // ticker. It is unset when they came from symbol itself.
  LaterTicker later_ticker = 5;
  // DividendFailure is why the symbol's dividends couldn't be downloaded or
  // used. Its prices weren't stored either.
  message DividendFailure {
    enum Kind {
      KIND_UNSPECIFIED = 0;
      // The provider answered with an HTTP error status, in http_status.
      KIND_HTTP_STATUS = 1;
      // The provider didn't answer.
      KIND_NO_ANSWER = 2;
      // The provider's answer couldn't be read.
      KIND_UNREADABLE = 3;
      // The provider sent dividends that can't be used, such as an amount
      // of 0 or a currency other than USD.
      KIND_INVALID = 4;
    }
    string provider = 1;
    Kind kind = 2;
    int32 http_status = 3;
  }
  // dividend_failure is set with STATUS_ERROR when the symbol's dividends
  // failed. Callers name the cause from it, not from error.
  DividendFailure dividend_failure = 6;
}

// GetOHLC reads bars already stored in the broker database.
// It does not download from Yahoo, Stooq, or Alpaca.
// Empty provider means yahoo. limit 0 means 252 (one trading year).
// limit is capped at 2520. symbols must be non-empty and is capped at 500.
message GetOHLCRequest {
  repeated string symbols = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "symbols_required"
      expression: "size(this) > 0"
    }
  }];
  // Inclusive upper bound on bar time. Required.
  google.protobuf.Timestamp as_of = 2 [(buf.validate.field) = {
    required: true
    cel: {
      id: "as_of_required"
      expression: "this != null"
    }
  }];
  // yahoo, stooq, or alpaca. Empty means yahoo.
  string provider = 3;
  // Per-symbol bar cap. 0 means 252. Values above 2520 are rejected.
  uint32 limit = 4;
}

message GetOHLCResponse {
  // Bars ordered by symbol ascending, then time ascending.
  repeated foreverbull.finance.v1.OHLC bars = 1;
}

service Marketdata {
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse) {}
  rpc GetIndex(GetIndexRequest) returns (GetIndexResponse) {}
  rpc DownloadHistoricalData(DownloadHistoricalDataRequest) returns (stream DownloadHistoricalDataResponse) {}
  rpc GetOHLC(GetOHLCRequest) returns (GetOHLCResponse) {}
}
