syntax = "proto3";

package foreverbull.finance.service.v1;

import "buf/validate/validate.proto";
import "foreverbull/common.proto";
import "foreverbull/finance/v1/marketdata.proto";
import "foreverbull/finance/v1/trading.proto";
import "foreverbull/service/v1/worker.proto";

option go_package = "github.com/lhjnilsson/foreverbull/pkg/pb/finance/service";

message GetPortfolioRequest {}

message GetPortfolioResponse {
  foreverbull.finance.v1.Portfolio portfolio = 1;
}

message GetOrdersRequest {}

message GetOrdersResponse {
  repeated foreverbull.finance.v1.Order orders = 1;
}

message CreateSessionRequest {
  repeated string symbols = 1;
}

message CreateSessionResponse {
  enum Step {
    CREATING = 0;
    UPDATING_MARKET_DATA = 1;
    STARTING = 2;
    FINISHING = 3;
  }
  message Status {
    Step step = 1;
    foreverbull.common.State state = 2;
  }
  foreverbull.finance.v1.Session session = 1;
  Status status = 2;
}

service TradingServicer {
  rpc GetPortfolio(GetPortfolioRequest) returns (GetPortfolioResponse) {}
  rpc GetOrders(GetOrdersRequest) returns (GetOrdersResponse) {}

  rpc CreateSession(CreateSessionRequest) returns (stream CreateSessionResponse) {}
}

message ConfigureRequest {
  foreverbull.service.v1.Algorithm algorithm = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "required_algo"
      expression: "this != null"
    }
  }];
}

message ConfigureResponse {
  foreverbull.service.v1.ExecutionConfiguration configuration = 1;
}

message RunRequest {
  repeated string symbols = 1;
}

message RunResponse {
  repeated foreverbull.finance.v1.Order orders = 1;
}

message PlaceOrderRequest {
  repeated foreverbull.finance.v1.Order orders = 1;
}

message PlaceOrderResponse {
  repeated foreverbull.finance.v1.Order orders = 1;
}

message StopServerRequest {}

message StopServerResponse {}

service SessionServicer {
  rpc Configure(ConfigureRequest) returns (ConfigureResponse) {}
  rpc Run(RunRequest) returns (RunResponse) {}
  rpc PlaceOrders(PlaceOrderRequest) returns (PlaceOrderResponse) {}
  rpc StopServer(StopServerRequest) returns (StopServerResponse) {}
}
