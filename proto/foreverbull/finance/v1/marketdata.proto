syntax = "proto3";

package foreverbull.finance.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/lhjnilsson/foreverbull/pkg/pb/finance";

message Asset {
  string symbol = 1;
  string name = 2;
}

message OHLC {
  string symbol = 1;
  google.protobuf.Timestamp timestamp = 2;
  double open = 3;
  double high = 4;
  double low = 5;
  double close = 6;
  uint64 volume = 7;
}

message Position {
  string symbol = 1;
  int32 amount = 2;
  double cost_basis = 3;
  double last_sale_price = 4;
  google.protobuf.Timestamp last_sale_date = 5;
}

message Portfolio {
  google.protobuf.Timestamp timestamp = 1;
  double cash_flow = 2;
  double starting_cash = 3;
  double portfolio_value = 4;
  double pnl = 5;
  double returns = 6;
  double cash = 7;
  double positions_value = 8;
  double positions_exposure = 9;

  repeated Position positions = 10;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_DAY = 1;
}

enum PositionIntent {
  POSITION_INTENT_UNSPECIFIED = 0;
  POSITION_INTENT_BUY_TO_OPEN = 1;
  POSITION_INTENT_SELL_TO_CLOSE = 2;
  POSITION_INTENT_BUY_TO_CLOSE = 3;
  POSITION_INTENT_SELL_TO_OPEN = 4;
}

message Order {
  string symbol = 1;
  int32 amount = 2;
  OrderType type = 3;
  TimeInForce time_in_force = 4;
  PositionIntent intent = 5;
}
