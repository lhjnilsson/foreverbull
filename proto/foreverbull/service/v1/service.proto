syntax = "proto3";

package foreverbull.service.v1;

import "foreverbull/service/v1/worker.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lhjnilsson/foreverbull/pkg/pb/service";

message Service {
  message Status {
    enum Status {
      CREATED = 0;
      INTERVIEW = 1;
      READY = 2;
      ERROR = 3;
    }
    Status status = 1;
    optional string error = 2;
    google.protobuf.Timestamp OccurredAt = 3;
  }
  string Image = 1;
  Algorithm algorithm = 2;
  repeated Status statuses = 3;
  // Server-filled login of the owning account. A client value is ignored.
  string owner_login = 4;
}
