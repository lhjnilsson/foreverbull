syntax = "proto3";

package foreverbull.service.service.v1;

import "buf/validate/validate.proto";
import "foreverbull/finance/v1/marketdata.proto";
import "foreverbull/service/v1/worker.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/lhjnilsson/foreverbull/pkg/pb/service/service";

message GetServiceInfoRequest {}

message GetServiceInfoResponse {
  foreverbull.service.v1.Algorithm algorithm = 1;
}

message ConfigureExecutionRequest {
  foreverbull.service.v1.ExecutionConfiguration configuration = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "required"
      expression: "this != null"
    }
  }];
}

message ConfigureExecutionResponse {}

message RunExecutionRequest {}

message RunExecutionResponse {}

message WorkerRequest {
  string task = 1;
  repeated string symbols = 2;
  foreverbull.finance.v1.Portfolio portfolio = 3;
  // Lookback bars for symbols as of the portfolio timestamp. The broker
  // fills these from stored bars (alias-resolved). The worker does not open
  // a database connection. Empty means the step has no stored bars.
  repeated foreverbull.finance.v1.OHLC bars = 4;
}

message WorkerResponse {
  string task = 1;
  repeated foreverbull.finance.v1.Order orders = 2;
  optional string error = 3;
}

enum NamespaceRequestType {
  GET = 0;
  SET = 1;
}

message NamespaceRequest {
  string key = 1;
  NamespaceRequestType type = 2;
  optional google.protobuf.Struct value = 3;
}

message NamespaceResponse {
  optional google.protobuf.Struct value = 1;
  optional string error = 2;
}

service Worker {
  rpc GetServiceInfo(GetServiceInfoRequest) returns (GetServiceInfoResponse) {}
  rpc ConfigureExecution(ConfigureExecutionRequest) returns (ConfigureExecutionResponse) {}
  rpc RunExecution(RunExecutionRequest) returns (RunExecutionResponse) {}
}
